<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 600px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            color: #ff6b95;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255, 107, 149, 0.3);
        }
        
        .message {
            font-size: 1.3em;
            color: #555;
            line-height: 1.8;
            margin: 20px 0;
        }
        
        .emoji-container {
            font-size: 4em;
            margin: 20px 0;
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b95, #ff8a8a);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 149, 0.4);
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 149, 0.6);
        }
        
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .heart {
            position: absolute;
            font-size: 30px;
            animation: fall linear infinite;
            opacity: 0;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        .quote-box {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            display: none;
        }
        
        .quote-box.show {
            display: block;
            animation: pop 0.5s ease;
        }
        
        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .flower {
            position: absolute;
            font-size: 40px;
            animation: sway 2s ease-in-out infinite;
        }
        
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        
        .gallery {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        
        .photo {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .photo:hover {
            transform: scale(1.2) rotate(5deg);
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <div class="emoji-container" id="mainEmoji">🌸</div>
        <h1>Hai, Cantik! 💖</h1>
        
        <div class="message" id="message">
            Hari ini adalah hari yang spesial untukmu!<br>
            Klik tombol di bawah ya...
        </div>
        
        <div class="gallery">
            <div class="photo" onclick="showLove()">❤️</div>
            <div class="photo" onclick="showFlower()">🌸</div>
            <div class="photo" onclick="showStar()">✨</div>
            <div class="photo" onclick="showHug()">🤗</div>
        </div>
        
        <button class="btn" onclick="showSurprise()">Klik Aku! 🎁</button>
        
        <div class="quote-box" id="quoteBox">
            <p id="quote" style="font-size: 1.5em; color: #fff; font-weight: bold;"></p>
        </div>
        
        <div class="flower" style="position: fixed; bottom: 20px; left: 20px;">🌷</div>
        <div class="flower" style="position: fixed; bottom: 20px; right: 20px;">🌷</div>
    </div>
    
    <script>
        const quotes = [
            "Kamu adalah alasan aku tersenyum setiap hari! 😊",
            "即使太阳从西边出来，我也会永远爱你! ❤️",
            "Kamu itu seperti superheroes - make my life better! 🦸‍♀️",
            "Setiap detik dengan kamu adalah hadiah terbaik! 🎁",
            "Cintaku padamu seperti gravity - selalu menarik ku ke arahmu! 🌍",
            "Kamu lucu, kamu imut, kamu segalanya! 🥰",
            "如果没有你，我的世界将失去色彩... jadi tetap ya! 🌈",
            "Kamu adalah春天的第一个花瓣! 🌸",
            "Aku bangga punya pacar seperti kamu! 💕",
            "Stay cute, stay happy, stay mine forever! 😘"
        ];
        
        const emojis = ['❤️', '🌸', '🥰', '💖', '✨', '🎉', '💕', '🤗', '🌺', '💝'];
        
        const messages = [
            "Heyy! Aku punya kejutan ni buat kamu...",
            "Baca ini ya, tapi jangan banyak expectation! 😄",
            "Sekarang dengerin baik-baik...",
            "Ini dia yang sejak lama mau aku bilang!",
            "Prepare hatimu ya...",
            "Warning: ini lucu banget nih! 😆"
        ];
        
        function showSurprise() {
            const quoteBox = document.getElementById('quoteBox');
            const quote = document.getElementById('quote');
            const message = document.getElementById('message');
            const mainEmoji = document.getElementById('mainEmoji');
            
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            
            message.innerHTML = randomMessage + "<br><br>";
            quote.innerHTML = randomQuote;
            quoteBox.classList.add('show');
            mainEmoji.textContent = randomEmoji;
            
            createHearts();
        }
        
        function showLove() {
            alert(' Seperti mencintai diri sendiri! ❤️ ');
            document.getElementById('message').innerHTML = "I Love You! ❤️❤️❤️";
            document.getElementById('mainEmoji').textContent = '❤️';
            createHearts();
        }
        
        function showFlower() {
            document.getElementById('message').innerHTML = "Untukmu segelasongarden penuh bunga! 🌸🌷🌻";
            document.getElementById('mainEmoji').textContent = '🌸';
        }
        
        function showStar() {
            document.getElementById('message').innerHTML = "Kamu adalah bintangtercerah dalam kegelapanku! ✨";
            document.getElementById('mainEmoji').textContent = '⭐';
        }
        
        function showHug() {
            document.getElementById('message').innerHTML = "IRTUAL HUG untukmu! 🤗 Semangat ya!";
            document.getElementById('mainEmoji').textContent = '🤗';
        }
        
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.textContent = ['❤️', '💕', '💖', '🌸', '✨', '🎉'][Math.floor(Math.random() * 6)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    heartsContainer.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, 5000);
                }, i * 200);
            }
        }
        
        // Create background hearts
        setInterval(createHearts, 8000);
        createHearts();
    </script>
</body>
</html>
